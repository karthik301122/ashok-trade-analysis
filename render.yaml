# Render Blueprint — https://ashoktrades.onrender.com
# After first deploy: rotate EODHD_API_TOKEN and move secrets to Render dashboard.

services:
  - type: web
    name: ashok-trades
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCTION_MODE
        value: "true"
      - key: DATA_PROVIDER
        value: eodhd
      - key: EODHD_YAHOO_FALLBACK
        value: "true"
      - key: EODHD_MIN_GAP_MS
        value: "600"
      - key: EODHD_SNAPSHOT_CONCURRENCY
        value: "1"
      - key: EODHD_SNAPSHOT_DELAY_MS
        value: "300"
      - key: EODHD_API_TOKEN
        value: 6a91a578276971.78855481
      # If login breaks after redeploy, re-add in dashboard or uncomment:
      # - key: AUTH_SECRET
      #   value: your-session-secret
      # - key: AUTH_USERS
      #   value: "user:$2b$..."
