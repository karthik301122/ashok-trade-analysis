# Render Blueprint — optional; production is on Azure (tradersscope.com).
# Set secrets in the Render dashboard — never commit API tokens.

services:
  - type: web
    name: ashok-trades
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCTION_MODE
        value: "true"
      - key: DATA_PROVIDER
        value: eodhd
      - key: EODHD_YAHOO_FALLBACK
        value: "true"
      - key: EODHD_MIN_GAP_MS
        value: "600"
      - key: EODHD_SNAPSHOT_CONCURRENCY
        value: "1"
      - key: EODHD_SNAPSHOT_DELAY_MS
        value: "300"
      - key: SERIES_RATE_LIMIT
        value: "2000"
      - key: EODHD_API_TOKEN
        sync: false
      - key: AUTH_SECRET
        sync: false
