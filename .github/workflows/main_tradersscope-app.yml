# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - tradersscope-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: npm ci, lint, build, test
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Prune dev dependencies for deploy
        run: npm prune --omit=dev

      - name: Create deploy zip
        run: |
          mkdir -p release
          cp -r dist server scripts src/data package.json package-lock.json node_modules release/
          cd release && zip -rq ../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FA0E0D5F92FD4940A3733C631ADE8130 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D02CFFC9A5364EE097DF7EF14707DB48 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4A4D9B7D11C74E9681799027E579F19B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: tradersscope-app
          slot-name: Production
          package: deploy/release.zip
